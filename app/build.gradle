plugins { id 'com.android.application' }

android {
    namespace 'com.simplehometv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.simplehometv'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
